[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "premortem-ml"
version = "0.2.0"
description = "Bounded pre-deployment stress simulation for numeric classifiers"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.5,<1.9"]
[project.optional-dependencies]
search = ["optuna>=4,<5"]
dev = ["pytest>=8,<10"]
[project.scripts]
premortem = "premortem.__main__:main"
premortem-web = "premortem.server:main"
[tool.setuptools.package-data]
premortem = ["dashboard.html", "web/*"]
[tool.setuptools.packages.find]
include = ["premortem*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
